<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyst Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 40px 48px;
    width: 360px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #fff;
  }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 28px; }
  label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
  input[type="text"], input[type="password"] {
    width: 100%;
    background: #111;
    border: 1px solid #333;
    border-radius: 6px;
    color: #e0e0e0;
    font-size: 14px;
    padding: 10px 12px;
    margin-bottom: 18px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #4a9eff; }
  .error {
    background: #2a1111;
    border: 1px solid #5a2020;
    border-radius: 6px;
    color: #e05050;
    font-size: 13px;
    padding: 10px 12px;
    margin-bottom: 18px;
  }
  button {
    width: 100%;
    background: #4a9eff;
    border: none;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    padding: 12px;
    transition: background 0.15s;
  }
  button:hover { background: #3a8ef0; }
</style>
</head>
<body>
<div class="card">
  <h1>Analyst Platform</h1>
  <p class="subtitle">Trade execution + signal broadcast</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Sign In</button>
  </form>
</div>
</body>
</html>
